name: Badger
options:
  bundleIdPrefix: top.mcxiafeng.badger
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic

targets:
  BadgerApp:
    type: application
    platform: iOS
    sources:
      - path: BadgerApp
        excludes:
          - "**/.DS_Store"
    preBuildScripts:
      - script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        name: Build Kotlin Framework
        inputFiles:
          - $(SRCROOT)/../shared/build.gradle.kts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.mcxiafeng.badger
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_FILE: BadgerApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks"
        OTHER_LDFLAGS: "$(inherited)"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
