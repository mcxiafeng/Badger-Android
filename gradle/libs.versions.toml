[versions]
agp = "8.12.0"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
androidx-activity = "1.12.2"
androidx-core = "1.17.0"
androidx-lifecycle = "2.9.4"
compose-bom = "2024.12.01"
kotlin = "2.3.21"
ksp = "2.3.6"
room = "2.8.4"
camerax = "1.3.4"
zxing-core = "3.5.3"
wechat-qrcode = "2.5.0"
mlkit-chinese = "16.0.1"
gson = "2.11.0"
okhttp = "4.12.0"
miuix = "0.9.3"
haze = "1.7.2"
coroutines = "1.10.2"
# [§14.2] Koin:DI 容器,替代 Hilt
koin = "4.0.0"
exifinterface = "1.4.1"
palette = "1.0.0"
coil = "3.4.0"
robolectric = "4.14.1"
mockk = "1.13.16"
truth = "1.4.4"
turbine = "1.2.0"
# [V2-P4] WorkManager 用于 PendingUpload 队列消费
androidx-work = "2.10.3"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
# [V2-P4] lifecycle-process:ProcessLifecycleOwner(用于观察 App 进入前台/后台)
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
# [§14.7 / §15.4 #38] ui-test-manifest 已被移除(无 androidTest 目录,debug 仅做 preview)

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }
wechat-qrcode-opencv = { module = "com.github.jenly1314.WeChatQRCode:opencv", version.ref = "wechat-qrcode" }
wechat-qrcode-opencv-armv64 = { module = "com.github.jenly1314.WeChatQRCode:opencv-armv64", version.ref = "wechat-qrcode" }
wechat-qrcode-opencv-armv7a = { module = "com.github.jenly1314.WeChatQRCode:opencv-armv7a", version.ref = "wechat-qrcode" }
wechat-qrcode-opencv-x64 = { module = "com.github.jenly1314.WeChatQRCode:opencv-x86_64", version.ref = "wechat-qrcode" }
wechat-qrcode = { module = "com.github.jenly1314.WeChatQRCode:wechat-qrcode", version.ref = "wechat-qrcode" }
mlkit-chinese = { module = "com.google.mlkit:text-recognition-chinese", version.ref = "mlkit-chinese" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-shader = { module = "top.yukonga.miuix.kmp:miuix-shader", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference", version.ref = "miuix" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-materials = { module = "dev.chrisbanes.haze:haze-materials", version.ref = "haze" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur", version.ref = "miuix" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
palette = { module = "androidx.palette:palette", version.ref = "palette" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# [§14.2] Koin:DI 容器,Koin 4.x 纯 Kotlin/反射,KMP/Android 全支持
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# [V2-P4] WorkManager:PendingUpload 队列消费 + 30s 恢复窗口兜底
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
# [§14.2] hilt-work 已移除(随 hilt 整体移除);如果以后想要"纯 Koin WorkerFactory" 也无需这层,
# 只需让 SyncWorkerFactory 调用 GlobalContext.get(),所以这条删除。

# [§14.2] Koin 4.x 测试 artifact:startKoin{}/stopKoin() inTest() 模块
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
# [§14.7 / §15.4 #38] mockk-android 已被移除(无 androidTest 目录,纯 JVM 单测用 mockk 即可)
truth = { module = "com.google.truth:truth", version.ref = "truth" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# [§14.2] hilt plugin 已移除 — Koin 不需要 plugin。
