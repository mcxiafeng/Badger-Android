[versions]
agp = "8.12.0"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
androidx-activity = "1.12.2"
androidx-core = "1.17.0"
androidx-lifecycle = "2.9.4"
compose-bom = "2024.12.01"
kotlin = "2.4.0"
ksp = "2.3.11"
room = "2.8.4"
camerax = "1.4.1"
zxing-core = "3.5.3"
wechat-qrcode = "2.5.0"
mlkit-chinese = "16.0.1"
# [KMP K04] Gson 降级为 testImplementation（JsonMigrationParityTest 对照 oracle），生产依赖已全部 kotlinx
gson = "2.11.0"
okhttp = "5.4.0"
miuix = "0.9.3"
haze = "1.7.2"
coroutines = "1.10.2"
# [KMP K04] Gson → kotlinx.serialization 全量迁移（网络选型已定 Ktor，序列化随之统一 kotlinx）
kotlinx-serialization = "1.9.0"
# [§14.2] Koin:DI 容器,替代 Hilt
koin = "4.0.0"
exifinterface = "1.4.1"
palette = "1.0.0"
coil = "3.4.0"
robolectric = "4.14.1"
mockk = "1.13.16"
truth = "1.4.4"
turbine = "1.2.0"
# [V2-P4] WorkManager 用于 PendingUpload 队列消费
androidx-work = "2.10.3"
# [KMP K02] Room KMP bundled driver
androidx-sqlite = "2.6.2"
# [KMP K02→K04] Q2 裁决：OkHttp 5.4.0 实测无 iOS native 变体 → 网络层选 Ktor
ktor = "3.1.3"
# [KMP K05] DataStore KMP（Preferences 多进程不需要，纯 Preferences API）
datastore = "1.1.7"
# [KMP K08] kotlinx-datetime（iOS actual nowMs）
kotlinx-datetime = "0.6.1"
# [KMP K08-B] atomicfu：common 侧原子变量（PrefsStore 快照等）
atomicfu = "0.26.1"
# [KMP K13] Compose Multiplatform 坐标线（miuix-ui 0.9.3 实际依赖 CMP 1.11.1，
# 其 android 变体映射 androidx.compose 1.11.2——Gradle 冲突解析早已收敛到该线）
compose-multiplatform = "1.11.1"
# [KMP K13] 图标体系（U03 选型结论）：Lucide CMP 版，对象属性逐图标访问（tree-shake 友好）
icons-lucide = "2.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
# [V2-P4] lifecycle-process:ProcessLifecycleOwner(用于观察 App 进入前台/后台)
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
# [§14.7 / §15.4 #38] ui-test-manifest 已被移除(无 androidTest 目录,debug 仅做 preview)

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
# [KMP K13] CMP 坐标：shared commonMain 的 UI 依赖统一走 org.jetbrains.compose.*（iOS target 可用）
cmp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
cmp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
cmp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-multiplatform" }
cmp-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
# [KMP K13] Lucide 图标（U03 选型）：替代 material-icons-extended，全 target CMP
icons-lucide = { module = "com.composables:icons-lucide-cmp", version.ref = "icons-lucide" }
# [KMP K15] lifecycle KMP 镜像坐标（koin-core-viewmodel 依赖 org.jetbrains.androidx.lifecycle 家族）
lifecycle-kmp-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
# [KMP K02] Room KMP 需要的 bundled SQLite driver（从源码编译 SQLite，全平台一致行为）
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
# [KMP K02] JVM 单测用 bundled-jvm（jar 内含 sqliteJni native；android 变体在 JVM 无 native）
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "androidx-sqlite" }
# [KMP Q2] Ktor：commonMain core + 各端 engine（JVM/Android=CIO，iOS=Darwin）
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
# [KMP K05] DataStore Preferences 跨端存储（commonMain 跨端 + androidMain 旧值搬迁用）
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }
wechat-qrcode-opencv = { module = "com.github.jenly1314.WeChatQRCode:opencv", version.ref = "wechat-qrcode" }
wechat-qrcode-opencv-armv64 = { module = "com.github.jenly1314.WeChatQRCode:opencv-armv64", version.ref = "wechat-qrcode" }
wechat-qrcode-opencv-armv7a = { module = "com.github.jenly1314.WeChatQRCode:opencv-armv7a", version.ref = "wechat-qrcode" }
wechat-qrcode-opencv-x64 = { module = "com.github.jenly1314.WeChatQRCode:opencv-x86_64", version.ref = "wechat-qrcode" }
wechat-qrcode = { module = "com.github.jenly1314.WeChatQRCode:wechat-qrcode", version.ref = "wechat-qrcode" }
mlkit-chinese = { module = "com.google.mlkit:text-recognition-chinese", version.ref = "mlkit-chinese" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# [KMP K04] kotlinx.serialization：K04 迁移完成后 gson 条目与依赖一并移除
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-shader = { module = "top.yukonga.miuix.kmp:miuix-shader", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference", version.ref = "miuix" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-materials = { module = "dev.chrisbanes.haze:haze-materials", version.ref = "haze" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
palette = { module = "androidx.palette:palette", version.ref = "palette" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# [§14.2] Koin:DI 容器,Koin 4.x 纯 Kotlin/反射,KMP/Android 全支持
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# [V2-P4] WorkManager:PendingUpload 队列消费 + 30s 恢复窗口兜底
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
# [§14.2] hilt-work 已移除(随 hilt 整体移除);如果以后想要"纯 Koin WorkerFactory" 也无需这层,
# 只需让 SyncWorkerFactory 调用 GlobalContext.get(),所以这条删除。

# [§14.2] Koin 4.x 测试 artifact:startKoin{}/stopKoin() inTest() 模块
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
# [KMP K15] koin-compose-viewmodel：CMP 版 koinViewModel()（lifecycle-viewmodel KMP）
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# [KMP K02] shared 模块单测需要显式 junit4（robolectric 的 junit 是 implementation 不透出）
junit4 = { module = "junit:junit", version = "4.13.2" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
# [§14.7 / §15.4 #38] mockk-android 已被移除(无 androidTest 目录,纯 JVM 单测用 mockk 即可)
truth = { module = "com.google.truth:truth", version.ref = "truth" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
# [KMP K02] shared 模块用
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# [§14.2] hilt plugin 已移除 — Koin 不需要 plugin。
