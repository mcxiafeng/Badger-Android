#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

# [§14.2] Hilt 已移除(libs.plugins.hilt 不再 alias),Room 是唯一 KSP 处理器,
# 无 Hilt ComponentTreeDepsGenerator 与 Room PSI 互相踩,恢复 KSP 增量编译。
ksp.incremental=true
ksp.incremental.intermodule=true
ksp.incremental.useClasspathSnapshot=true

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -Djdk.attach.allowAttachSelf=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.java.home=C\:/Program Files/Java/jdk-17
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37.0
android.r8.optimizedResourceShrinking=true
