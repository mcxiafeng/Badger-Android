#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M

# [修复防御]: 关闭 KSP 增量编译。
# Hilt 2.60.x 的 ComponentTreeDepsGenerator 与 Room 的 PSI 修改会在同一轮内冲突，
# 导致 KaInvalidLifetimeOwnerAccessException。关闭增量后，Hilt 一次性重建文件，
# 不再触发 PSI 句柄失效。代价：每次 KSP 重跑都会扫描所有源文件。
ksp.incremental=false

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -Djdk.attach.allowAttachSelf=true
org.gradle.workers.max=2
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.java.home=C\:/Program Files/Java/jdk-17
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37.0
android.r8.optimizedResourceShrinking=true