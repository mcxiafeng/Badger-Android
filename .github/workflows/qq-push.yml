name: QQ Push

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target_type:
        description: '推送类型'
        required: true
        default: 'group'
        type: choice
        options:
          - group
          - private
      target_id:
        description: 'QQ群号或QQ号'
        required: true
        type: string
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - beta
      message:
        description: '附带消息（留空则使用commit信息）'
        required: false
        type: string

concurrency:
  group: qq-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.config.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK Components
        run: |
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "platforms;android-37" --channel=3 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local Java home override
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Determine build type
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          else
            echo "build_type=debug" >> $GITHUB_OUTPUT
          fi

      - name: Decode Keystore
        if: steps.config.outputs.build_type != 'debug'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build Debug APK
        if: steps.config.outputs.build_type == 'debug'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: steps.config.outputs.build_type == 'release'
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Beta APK
        if: steps.config.outputs.build_type == 'beta'
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleBeta --stacktrace

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: qq-push-apk-arm64
          path: app/build/outputs/apk/${{ steps.config.outputs.build_type }}/*arm64-v8a*.apk
          retention-days: 1

  qq-push:
    name: Push to QQ
    runs-on: ubuntu-latest
    needs: build
    environment: Action Key
    if: ${{ success() }}
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: qq-push-apk-arm64
          path: apk

      - name: Install Python dependencies
        run: pip install websockets

      - name: Push to QQ via NapCat WebSocket
        env:
          NAPCAT_WS_URL: ${{ secrets.NAPCAT_WS_URL }}
          NAPCAT_TOKEN: ${{ secrets.NAPCAT_TOKEN }}
          TARGET_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_type || 'group' }}
          TARGET_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target_id || vars.QQ_DEFAULT_TARGET_ID }}
          BUILD_TYPE: ${{ needs.build.outputs.build_type }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
          CUSTOM_MSG: ${{ github.event_name == 'workflow_dispatch' && inputs.message || '' }}
        run: |
          python3 << 'PYEOF'
          import asyncio
          import base64
          import hashlib
          import json
          import os
          import sys
          import uuid
          from pathlib import Path

          try:
              import websockets
          except ImportError:
              print("ERROR: websockets not installed", file=sys.stderr)
              sys.exit(1)

          WS_URL = os.environ["NAPCAT_WS_URL"]
          TOKEN = os.environ["NAPCAT_TOKEN"]
          TARGET_TYPE = os.environ["TARGET_TYPE"]
          TARGET_ID = os.environ["TARGET_ID"]
          BUILD_TYPE = os.environ["BUILD_TYPE"]
          CUSTOM_MSG = os.environ.get("CUSTOM_MSG", "")

          CHUNK_SIZE = 1024 * 1024  # 1MB per chunk

          def find_apk():
              apk_dir = Path("apk")
              matches = list(apk_dir.rglob("*arm64-v8a*.apk"))
              if not matches:
                  print("ERROR: No arm64-v8a APK found", file=sys.stderr)
                  sys.exit(1)
              return matches[0]

          def compute_chunks(file_path):
              chunks = []
              hasher = hashlib.sha256()
              total_size = 0
              with open(file_path, "rb") as f:
                  while True:
                      chunk = f.read(CHUNK_SIZE)
                      if not chunk:
                          break
                      chunks.append(chunk)
                      hasher.update(chunk)
                      total_size += len(chunk)
              return chunks, hasher.hexdigest(), total_size

          async def send_action(ws, action, params):
              echo = str(uuid.uuid4())
              msg = {"action": action, "params": params, "echo": echo}
              await ws.send(json.dumps(msg))
              while True:
                  resp = json.loads(await ws.recv())
                  if resp.get("echo") == echo:
                      return resp
                  # skip other messages

          async def upload_file_stream(ws, file_path):
              chunks, sha256_hash, total_size = compute_chunks(file_path)
              stream_id = str(uuid.uuid4())
              filename = file_path.name
              total_chunks = len(chunks)

              print(f"Uploading {filename}: {total_size} bytes, {total_chunks} chunks, SHA256={sha256_hash}")

              for i, chunk_data in enumerate(chunks):
                  params = {
                      "stream_id": stream_id,
                      "chunk_data": base64.b64encode(chunk_data).decode(),
                      "chunk_index": i,
                      "total_chunks": total_chunks,
                      "file_size": total_size,
                      "expected_sha256": sha256_hash,
                      "filename": filename,
                      "file_retention": 30 * 1000,
                  }
                  resp = await send_action(ws, "upload_file_stream", params)
                  if resp.get("status") != "ok":
                      print(f"ERROR: Chunk {i} upload failed: {resp}", file=sys.stderr)
                      sys.exit(1)
                  print(f"  Chunk {i+1}/{total_chunks} uploaded")

              # Signal completion
              resp = await send_action(ws, "upload_file_stream", {"stream_id": stream_id, "is_complete": True})
              if resp.get("status") != "ok":
                  print(f"ERROR: File merge failed: {resp}", file=sys.stderr)
                  sys.exit(1)

              result = resp.get("data", {})
              if result.get("status") != "file_complete":
                  print(f"ERROR: Unexpected status: {result}", file=sys.stderr)
                  sys.exit(1)

              file_path_on_server = result["file_path"]
              print(f"Upload complete! Server path: {file_path_on_server}")
              return file_path_on_server

          async def send_file_message(ws, server_path, filename, message):
              action = "send_group_msg" if TARGET_TYPE == "group" else "send_private_msg"
              id_field = "group_id" if TARGET_TYPE == "group" else "user_id"

              msg = []
              if message:
                  msg.append({"type": "text", "data": {"text": message}})
              msg.append({"type": "file", "data": {"file": f"file:///{server_path}", "name": filename}})

              params = {id_field: TARGET_ID, "message": msg}
              resp = await send_action(ws, action, params)

              if resp.get("status") != "ok":
                  print(f"ERROR: Send message failed: {resp}", file=sys.stderr)
                  sys.exit(1)

              print(f"Message sent successfully!")
              return resp

          async def main():
              apk_path = find_apk()
              print(f"APK: {apk_path.name}")

              # Build message
              if CUSTOM_MSG:
                  message = CUSTOM_MSG
              else:
                  commit_msg = os.environ.get("COMMIT_MSG", "").split("\n")[0][:200]
                  commit_url = os.environ.get("COMMIT_URL", "")
                  actor = os.environ.get("ACTOR", "")
                  message = f"New {BUILD_TYPE} build\nCommit: {commit_msg}\nBy: {actor}\n{commit_url}"

              # Connect
              headers = {}
              if TOKEN:
                  headers["Authorization"] = f"Bearer {TOKEN}"
              print(f"Connecting to {WS_URL} ...")
              async with websockets.connect(WS_URL, additional_headers=headers) as ws:
                  print("Connected!")

                  # Upload via stream
                  server_path = await upload_file_stream(ws, apk_path)

                  # Send message with file
                  result = await send_file_message(ws, server_path, apk_path.name, message)

              # Write summary
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("### QQ Push Result :white_check_mark:\n")
                  f.write(f"| Key | Value |\n|-----|-------|\n")
                  f.write(f"| Build | {BUILD_TYPE} |\n")
                  f.write(f"| Target | {TARGET_TYPE}: {TARGET_ID} |\n")
                  f.write(f"| File | `{apk_path.name}` |\n")

          asyncio.run(main())
          PYEOF
