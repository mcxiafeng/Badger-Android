name: Build Debug APK

on:
  push:
    branches: [master, dev, refactor/dev-cleanup-2026-08-31]
  pull_request:
    branches: [master, dev]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # BEGIN ONE_SHOT_UI_REFACTOR
  refactor:
    name: Apply UI refactor batch
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/dev-cleanup-2026-08-31' && github.event.head_commit.message != 'chore(ui): apply refactor batch' && github.event.head_commit.message != 'chore(ci): remove one-shot refactor job'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dev-cleanup-2026-08-31
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Apply structural UI refactors
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          def read(path):
              return (root / path).read_text()

          def write(path, text):
              (root / path).write_text(text)

          # T8: Person — eliminate composition-time mutable state and stale callbacks,
          # then split list/index components out of the 40KB+ screen file.
          person_path = 'app/src/main/kotlin/top/mcxiafeng/badger/pages/person/PersonPage.kt'
          person = read(person_path)
          person = person.replace('        onRefreshData = { viewModel.refreshUserProfile() },\n', '')
          person = person.replace('        onAddContact = onScanContact,\n', '')
          person = person.replace('    onRefreshData: () -> Unit = {},\n', '')
          person = person.replace('    onAddContact: () -> Unit = {},\n', '')
          person = re.sub(r'    // PersonScreen 每次重进 composition.*?\n    LaunchedEffect\(Unit\) \{\n        onRefreshData\(\)\n    \}\n\n', '', person, flags=re.S)
          person = re.sub(r'    // 跟踪已显示的字母标题.*?val lastShownLetter = remember \{ Ref<String\?>\(null\) \}\n\n', '', person, flags=re.S)
          person = person.replace('        if (showAlphabetHeaders) lastShownLetter.v = null\n', '')
          person = person.replace('''                            val showHeader = if (!showAlphabetHeaders) {\n                                false\n                            } else if (prevLetter != null) {\n                                currentLetter != prevLetter\n                            } else {\n                                currentLetter != lastShownLetter.v\n                            }''', '''                            val showHeader = showAlphabetHeaders &&\n                                (index == 0 || currentLetter != prevLetter)''')
          person = person.replace('                                    lastShownLetter.v = currentLetter\n', '')

          # Move focused visual/list helpers to a dedicated file.
          helper_start = person.find('/**\n * 「我的名片」头部组件')
          ref_start = person.find('/** 简单可变引用包装', helper_start)
          if helper_start >= 0 and ref_start >= 0:
              ref_end = person.find('\n', person.find('private class Ref<T>(var v: T)', ref_start))
              helper_end = ref_end if ref_end >= 0 else len(person)
              helpers = person[helper_start:helper_end].strip() + '\n'
              helpers = helpers.replace('private fun MyProfileHeader', 'internal fun MyProfileHeader')
              helpers = helpers.replace('private fun ContactItem', 'internal fun ContactItem')
              helpers = helpers.replace('private fun ContactRow', 'internal fun ContactRow')
              helpers = helpers.replace('fun LetterIndexBar(', 'internal fun LetterIndexBar(', 1)
              helpers = helpers.replace('fun LetterTooltip(', 'internal fun LetterTooltip(', 1)
              imports = person[:person.find('private const val TAG')]
              write('app/src/main/kotlin/top/mcxiafeng/badger/pages/person/PersonListComponents.kt', imports.replace('package top.mcxiafeng.badger.pages.person\n', 'package top.mcxiafeng.badger.pages.person\n\n') + '\n' + helpers)
              person = person[:helper_start].rstrip() + '\n'

          write(person_path, person)

          # T9: Avatar persistence belongs to AvatarStorage/ViewModel, not the Composable.
          detail_path = 'app/src/main/kotlin/top/mcxiafeng/badger/pages/person/contact/ContactDetailPage.kt'
          detail = read(detail_path)
          old = '''    val onCropConfirm: (Bitmap) -> Unit = { croppedBitmap ->\n        scope.launch {\n            try {\n                val avatarFile = withContext(Dispatchers.IO) {\n                    Methods.saveBitmapAsAvatar(context, croppedBitmap, "contact_${contactId}_avatar.webp")\n                }\n                viewModel.applyAvatarUpdate(contactId, avatarFile.absolutePath)\n                avatarVersion++\n            } catch (e: Exception) {\n                Log.e("ContactDetailPage", "设置头像失败", e)\n                Toast.makeText(context, "设置头像失败", Toast.LENGTH_SHORT).show()\n            }\n        }\n    }'''
          new = '''    val onCropConfirm: (Bitmap) -> Unit = { croppedBitmap ->\n        viewModel.saveAndApplyAvatar(contactId, croppedBitmap)\n        avatarVersion++\n    }'''
          if old in detail:
              detail = detail.replace(old, new, 1)
          write(detail_path, detail)

          # T10: dead CardRoute compatibility callbacks.
          card_path = 'app/src/main/kotlin/top/mcxiafeng/badger/pages/card/CardPage.kt'
          card = read(card_path)
          card = card.replace('''fun CardRoute(\n    onScanToCollection: ((Long) -> Unit)? = null,\n    onContactClick: ((Long) -> Unit)? = null,\n    onNavigateToCollectionDetail: (Long) -> Unit = {}\n) {''', '''fun CardRoute(\n    onNavigateToCollectionDetail: (Long) -> Unit = {}\n) {''')
          write(card_path, card)

          # T13: remove service-locator use from Compose callers.
          compose_paths = [
              'app/src/main/kotlin/top/mcxiafeng/badger/pages/person/contact/AddContactFieldDialog.kt',
              'app/src/main/kotlin/top/mcxiafeng/badger/pages/person/contact/AddPlatformDialog.kt',
              'app/src/main/kotlin/top/mcxiafeng/badger/pages/person/contact/CreateContactPage.kt',
              'app/src/main/kotlin/top/mcxiafeng/badger/pages/person/contact/ImportFromPlatformDialog.kt',
              'app/src/main/kotlin/top/mcxiafeng/badger/pages/person/contact/RegionPickerDialog.kt',
              'app/src/main/kotlin/top/mcxiafeng/badger/pages/settings/PlatformListPage.kt',
              'app/src/main/kotlin/top/mcxiafeng/badger/pages/setupguide/SetupStepAccount.kt',
          ]
          for path in compose_paths:
              p = root / path
              if not p.exists():
                  continue
              s = p.read_text()
              if 'KoinComponentBy' not in s:
                  continue
              s = re.sub(r'remember\s*\{\s*KoinComponentBy\.get<([^>]+)>\(\)\s*\}', r'koinInject<\1>()', s)
              s = re.sub(r'KoinComponentBy\.get<([^>]+)>\(\)', r'koinInject<\1>()', s)
              s = s.replace('import top.mcxiafeng.badger.di.KoinComponentBy\n', '')
              if 'koinInject<' in s and 'import org.koin.compose.koinInject' not in s:
                  imports = s.find('import ')
                  s = s[:imports] + 'import org.koin.compose.koinInject\n' + s[imports:]
              p.write_text(s)

          # AuthScreen reads the verification state from its own ViewModel.
          auth_path = 'app/src/main/kotlin/top/mcxiafeng/badger/pages/auth/AuthScreens.kt'
          auth = read(auth_path)
          auth = auth.replace('import top.mcxiafeng.badger.pages.settings.AccountSettingsViewModel\n', '')
          auth = auth.replace('import top.mcxiafeng.badger.data.repository.ServerUrlHolder\n', '')
          auth = auth.replace('''    val accountViewModel: AccountSettingsViewModel = koinViewModel()\n    val accountState by accountViewModel.state.collectAsState()\n    val serverUrlHolder: ServerUrlHolder = top.mcxiafeng.badger.di.KoinComponentBy.get()\n    val isUrlVerified by serverUrlHolder.isUrlVerified.collectAsState()''', '''    val isUrlVerified by viewModel.isUrlVerified.collectAsState()''')
          write(auth_path, auth)

          # Koin 4 Java compatibility call needs the explicit class argument.
          resolver_path = 'app/src/main/kotlin/top/mcxiafeng/badger/network/ContactNetworkResolver.kt'
          resolver = read(resolver_path)
          resolver = resolver.replace('KoinJavaComponent.get<ContactNetworkResolver>()', 'KoinJavaComponent.get(ContactNetworkResolver::class.java)')
          write(resolver_path, resolver)

          # UI state: consume the navigation bar setting as a StateFlow.
          ui_path = 'app/src/main/kotlin/top/mcxiafeng/badger/pages/settings/UiSettingsPage.kt'
          ui = read(ui_path)
          ui = ui.replace('import androidx.compose.runtime.mutableStateOf\n', '')
          ui = ui.replace('import androidx.compose.runtime.setValue\n', '')
          ui = ui.replace('''    var floatingEnabled by remember { mutableStateOf(NavBarConfig.isFloatingEnabled(context)) }''', '''    val floatingEnabled by NavBarConfig.floatingFlow.collectAsState(initial = NavBarConfig.isFloatingEnabled(context))''')
          write(ui_path, ui)

          # Match the full-screen loading component name with its layout behavior.
          load_path = 'app/src/main/kotlin/top/mcxiafeng/badger/ui/components/BadgerLoadingState.kt'
          loading = read(load_path).replace('''        modifier = modifier\n            .fillMaxWidth()\n            .height(200.dp),''', '''        modifier = modifier.fillMaxWidth().heightIn(min = 200.dp),''')
          # Keep height() for Spacer usage; only add heightIn if it is not already imported.
          if 'import androidx.compose.foundation.layout.heightIn\n' not in loading:
              loading = loading.replace('import androidx.compose.foundation.layout.height\n', 'import androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.heightIn\n')
          write(load_path, loading)

          # Dead compatibility UI: migrate all call sites before deleting the old shim.
          for p in (root / 'app/src/main/kotlin').rglob('*.kt'):
              s = p.read_text()
              if 'EmptyStateView' not in s:
                  continue
              s = s.replace('EmptyStateView(', 'BadgerEmptyState(')
              s = s.replace('import top.mcxiafeng.badger.ui.components.EmptyStateView\n', 'import top.mcxiafeng.badger.ui.components.BadgerEmptyState\n')
              p.write_text(s)
          old_empty = root / 'app/src/main/kotlin/top/mcxiafeng/badger/ui/components/EmptyStateView.kt'
          if old_empty.exists() and not any('EmptyStateView' in p.read_text() for p in (root / 'app/src/main/kotlin').rglob('*.kt')):
              old_empty.unlink()

          shim = root / 'app/src/main/kotlin/top/mcxiafeng/badger/di/KoinComponentBy.kt'
          refs = [p for p in (root / 'app/src/main/kotlin').rglob('*.kt') if 'KoinComponentBy' in p.read_text()]
          if shim.exists() and not refs:
              shim.unlink()

      - name: Verify refactor and build
        run: |
          if rg -n "KoinComponentBy|EmptyStateView" app/src/main/kotlin; then
            echo "Legacy UI/service-locator references remain"
            exit 1
          fi
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Commit refactor batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin
          git diff --cached --check
          git commit -m 'chore(ui): apply refactor batch'
          git push origin HEAD:refactor/dev-cleanup-2026-08-31
  # END ONE_SHOT_UI_REFACTOR

  build:
    name: Build
    needs: [refactor]
    if: always() && (needs.refactor.result == 'success' || needs.refactor.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK Components
        run: |
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "platforms;android-37" --channel=3 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local Java home override
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
