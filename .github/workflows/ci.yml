name: Build Debug APK

on:
  push:
    branches: [master, dev, refactor/dev-cleanup-2026-08-31]
  pull_request:
    branches: [master, dev]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK Components
        run: |
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "platforms;android-37" --channel=3 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local Java home override
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Apply one-shot source refactor
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/dev-cleanup-2026-08-31'
        shell: bash
        run: |
          if [ -f tools/finalize_ui_refactor.py ]; then
            python3 tools/finalize_ui_refactor.py
          fi

      - name: Build and test
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Commit successful refactor
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/dev-cleanup-2026-08-31'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin tools/finalize_ui_refactor.py
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(ui): finalize refactor pass'
          git push origin HEAD:refactor/dev-cleanup-2026-08-31

      - name: Upload debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
