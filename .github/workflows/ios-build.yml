name: iOS Build Gate

on:
  push:
    branches: [master, dev]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [master]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS Framework Compile + App Build
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local Java home override
        run: sed -i '' '/org.gradle.java.home/d' gradle.properties

      # Step 1: 编译 shared iOS framework（arm64 simulator）
      - name: Compile shared for iOS Simulator Arm64
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace

      # Step 2: 链接 iOS framework（真机 arm64 + 模拟器 arm64）
      - name: Link iOS framework (simulator arm64)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      # Step 3: 安装 XcodeGen
      - name: Install XcodeGen
        run: brew install xcodegen

      # Step 4: 生成 Xcode 工程
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # Step 5: xcodebuild 编译验证（模拟器 SDK，不签名）
      - name: Build iOS app (simulator, no code signing)
        run: |
          xcodebuild build \
            -project iosApp/Badger.xcodeproj \
            -scheme BadgerApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            iosApp/Badger.xcodeproj
            shared/build/reports/
          retention-days: 7
