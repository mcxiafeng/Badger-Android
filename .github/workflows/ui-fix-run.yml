name: UI Fix Run

on:
  push:
    branches:
      - refactor/dev-cleanup-2026-08-31

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses
      - run: sdkmanager --install "build-tools;34.0.0"
      - run: sdkmanager --install "platforms;android-37" --channel=3 || true
      - uses: gradle/actions/setup-gradle@v4
      - run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Patch scanner page and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt")
          text = path.read_text(encoding="utf-8")
          if "var isSavingResult by remember" in text:
              raise SystemExit("already patched")

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(label + " marker count != 1")
              text = text.replace(old, new, 1)

          def matching_brace(src, opening):
              depth = 0
              i = opening
              in_string = in_char = line = block = triple = False
              escape = False
              while i < len(src):
                  c = src[i]
                  n = src[i + 1] if i + 1 < len(src) else ""
                  if line:
                      if c == "\n": line = False
                  elif block:
                      if c == "*" and n == "/": block = False; i += 1
                  elif triple:
                      if src.startswith('"""', i): triple = False; i += 2
                  elif in_string:
                      if escape: escape = False
                      elif c == "\\": escape = True
                      elif c == '"': in_string = False
                  elif in_char:
                      if escape: escape = False
                      elif c == "\\": escape = True
                      elif c == "'": in_char = False
                  else:
                      if c == "/" and n == "/": line = True; i += 1
                      elif c == "/" and n == "*": block = True; i += 1
                      elif src.startswith('"""', i): triple = True; i += 2
                      elif c == '"': in_string = True
                      elif c == "'": in_char = True
                      elif c == "{": depth += 1
                      elif c == "}":
                          depth -= 1
                          if depth == 0: return i
                  i += 1
              raise SystemExit("unmatched brace")

          replace_once("import kotlinx.coroutines.Dispatchers\n", "import kotlinx.coroutines.CancellationException\nimport kotlinx.coroutines.Dispatchers\n", "CancellationException")
          replace_once("    var isProcessingPhoto by remember { mutableStateOf(false) }\n", "    var isProcessingPhoto by remember { mutableStateOf(false) }\n    var isSavingResult by remember { mutableStateOf(false) }\n", "saving state")
          replace_once("    val hasResultDialog = scanResult != null || ocrExtractedInfo != null || qrCodeContents.isNotEmpty() || isProcessingPhoto || aiOcrError != null || photoNoResult\n", "    val hasResultDialog = scanResult != null || ocrExtractedInfo != null || qrCodeContents.isNotEmpty() || isProcessingPhoto || aiOcrError != null || photoNoResult || isSavingResult\n", "dialog state")
          replace_once("    BackHandler(enabled = hasResultDialog) {\n", "    BackHandler(enabled = hasResultDialog && !isSavingResult) {\n", "back handler")
          replace_once("            isProcessingPhoto = false\n            aiOcrError = null\n", "            isProcessingPhoto = false\n            isSavingResult = false\n            aiOcrError = null\n", "reset save state")

          confirm = text.index("onConfirm = { selectedItems, existingContact, conflictResolutions, markerConfig ->")
          launch = text.index("scope.launch(Dispatchers.IO) {", confirm)
          text = text[:launch] + "if (isSavingResult || selectedItems.isEmpty()) return@ResultDialog\n                        isSavingResult = true\n                        " + text[launch:]
          launch = text.index("scope.launch(Dispatchers.IO) {", confirm)
          opening = text.index("{", launch)
          closing = matching_brace(text, opening)
          body = text[opening + 1:closing]
          outer_reset = "\n                        resetScannerState()"
          if outer_reset not in text[closing:]:
              raise SystemExit("confirm outer reset not found")
          reset_at = text.index(outer_reset, closing)
          text = text[:reset_at] + text[reset_at + len(outer_reset):]
          closing = matching_brace(text, opening)
          text = text[:closing] + "\n                            withContext(Dispatchers.Main.immediate) {\n                                resetScannerState()\n                            }\n                        }" + text[closing + 1:]

          attach = text.index("onAttachToExisting = { contact, info, markerConfig ->")
          launch = text.index("scope.launch(Dispatchers.IO) {", attach)
          text = text[:launch] + "if (isSavingResult) return@ResultDialog\n                        isSavingResult = true\n                        " + text[launch:]

          path.write_text(text, encoding="utf-8")

          report_path = Path("CODE_REVIEW_REPORT_2026-09-01.md")
          report = report_path.read_text(encoding="utf-8")
          if "### 10.5 Scanner ResultDialog / saving lifecycle" not in report:
              idx = report.find("## 11.")
              if idx < 0:
                  raise SystemExit("report section 11 missing")
              section = """### 10.5 Scanner ResultDialog / saving lifecycle (completed)

- Scanner result persistence now has an explicit `isSavingResult` lifecycle. While saving, the ResultDialog remains open, camera scanning stays paused, Back is blocked, and duplicate submissions are ignored.
- The previous unconditional scanner reset after launching the persistence coroutine has been removed; scanner state is cleared only after persistence reaches the Main dispatcher.
- Attach-to-existing follows the same duplicate-submit guard while retaining its existing success Toast/reset behavior.
- `ResultDialog` network resolution and cancellation handling were fixed in the preceding UI pass.
- This round is validated by branch CI with `assembleDebug` before the source commit is persisted.

"""
              report_path.write_text(report[:idx] + section + report[idx:], encoding="utf-8")
          PY

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit source and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/ci.yml
          git rm -f .github/workflows/ui-fix-run.yml .github/workflows/test-trigger.yml .github/workflows/apply-scanner-ui.yml .github/workflows/_ui_lifecycle_fix.yml .github/workflows/ui-lifecycle-fix.yml .github/workflows/scanner-ui-fix.yml .github/workflows/finalize-scanner-ui.yml || true
          git add app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt CODE_REVIEW_REPORT_2026-09-01.md .github/workflows/ci.yml
          git commit -m "fix(scanner): complete result dialog save lifecycle"
          git push origin HEAD:refactor/dev-cleanup-2026-08-31
