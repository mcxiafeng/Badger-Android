name: KMP iOS Compile Gate

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

concurrency:
  group: kmp-${{ github.ref }}
  cancel-in-progress: true

# [K03] K0–K4 阶段唯一 iOS 门槛：shared 模块 iOS simulator arm64 编译（不要求真机/模拟器运行）。
# 不影响 ci.yml（master debug APK）与 release.yml（tag 发布）。
jobs:
  ios-compile:
    name: iOS Simulator Arm64 Compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # konan 依赖（Kotlin/Native 编译器 + 平台依赖）首次下载约 1-2 分钟，按 Kotlin 版本缓存
      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-kotlin-2.3.21
          restore-keys: konan-${{ runner.os }}-

      - name: Remove local Java home override
        run: sed -i '' '/org.gradle.java.home/d' gradle.properties

      # 门禁 1：iOS simulator arm64 编译（K0–K4 阶段 UI 未进 shared，业务层先过门禁）
      - name: Compile shared for iOS Simulator Arm64
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace

      # 门禁 2：shared 模块 JVM 单测（Room LIKE/迁移行为；排除依赖外网的 KtorSpikeTest，防 CI flaky）
      - name: Run shared unit tests (Room spike, no network)
        run: ./gradlew :shared:testDebugUnitTest --tests "top.mcxiafeng.badger.shared.db.*" --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/
          retention-days: 3
