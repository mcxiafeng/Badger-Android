name: scanner-ui-fix

on:
  push:
    branches:
      - refactor/dev-cleanup-2026-08-31

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dev-cleanup-2026-08-31
          fetch-depth: 2

      - name: Apply scanner UI lifecycle fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          dialogs = Path("app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerDialogs.kt")
          text = dialogs.read_text()

          if "import kotlinx.coroutines.CancellationException" not in text:
              anchor = "import kotlinx.coroutines.Dispatchers\n"
              if anchor not in text:
                  raise SystemExit("Dispatchers import not found")
              text = text.replace(anchor, anchor + "import kotlinx.coroutines.CancellationException\n", 1)

          catch_pattern = re.compile(
              r'} catch \(e: Throwable\) \{\s*Log\.w\("ScannerDialogs", "batchResolve failed: \$\{e\.message\}"\)\s*List\(jobs\.size\) \{ null \}\s*}'
          )
          replacement = '''} catch (e: Throwable) {
        if (e is CancellationException) throw e
        Log.w("ScannerDialogs", "batchResolve failed: ${e.message}")
        List(jobs.size) { null }
    }'''
          text, n = catch_pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f"batchResolve catch block replacement count={n}")

          marker = "    val scope = rememberCoroutineScope()\n\n"
          if marker not in text:
              raise SystemExit("ResultDialog coroutine scope declaration not found")
          text = text.replace(marker, "", 1)

          result_start = text.index("internal fun ResultDialog(")
          before = text[:result_start]
          result_body = text[result_start:]
          launch_marker = "scope.launch(Dispatchers.IO) {"
          count = result_body.count(launch_marker)
          if count != 2:
              raise SystemExit(f"ResultDialog resolver launch count={count}")
          result_body = result_body.replace(launch_marker, "withContext(Dispatchers.IO) {", 2)
          text = before + result_body
          dialogs.write_text(text)

          page = Path("app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt")
          text = page.read_text()

          if "import kotlinx.coroutines.CancellationException" not in text:
              anchor = "import kotlinx.coroutines.Dispatchers\n"
              if anchor not in text:
                  raise SystemExit("ScannerPage Dispatchers import not found")
              text = text.replace(anchor, anchor + "import kotlinx.coroutines.CancellationException\n", 1)

          if "top.yukonga.miuix.kmp.basic.CircularProgressIndicator" not in text:
              anchor = "import top.yukonga.miuix.kmp.basic.Text\n"
              if anchor not in text:
                  raise SystemExit("ScannerPage Text import not found")
              text = text.replace(
                  anchor,
                  anchor + "import top.yukonga.miuix.kmp.basic.CircularProgressIndicator\n",
                  1,
              )

          if "top.yukonga.miuix.kmp.window.WindowDialog" not in text:
              anchor = "import top.yukonga.miuix.kmp.basic.CircularProgressIndicator\n"
              text = text.replace(
                  anchor,
                  anchor + "import top.yukonga.miuix.kmp.window.WindowDialog\n",
                  1,
              )

          if "var isSavingResult by remember { mutableStateOf(false) }" not in text:
              anchor = "    var isProcessingPhoto by remember { mutableStateOf(false) }\n"
              if anchor not in text:
                  raise SystemExit("isProcessingPhoto state declaration not found")
              text = text.replace(
                  anchor,
                  anchor + "    var isSavingResult by remember { mutableStateOf(false) }\n",
                  1,
              )

          old = """    val hasResultDialog = scanResult != null || ocrExtractedInfo != null || qrCodeContents.isNotEmpty() || isProcessingPhoto || aiOcrError != null || photoNoResult"""
          new = """    val hasResultDialog = scanResult != null || ocrExtractedInfo != null || qrCodeContents.isNotEmpty() || isProcessingPhoto || aiOcrError != null || photoNoResult || isSavingResult"""
          if old not in text:
              raise SystemExit("hasResultDialog expression not found")
          text = text.replace(old, new, 1)

          old = """    BackHandler(enabled = hasResultDialog) {"""
          new = """    BackHandler(enabled = hasResultDialog && !isSavingResult) {"""
          if old not in text:
              raise SystemExit("result BackHandler not found")
          text = text.replace(old, new, 1)

          anchor = """        lastDismissTime.set(System.currentTimeMillis())\n    }\n    BackHandler(enabled = !hasResultDialog) {"""
          replacement = """        lastDismissTime.set(System.currentTimeMillis())\n    }\n    BackHandler(enabled = isSavingResult) {\n        // 保存期间禁止退出，等待数据库写入完成。\n    }\n    BackHandler(enabled = !hasResultDialog) {"""
          if anchor not in text:
              raise SystemExit("BackHandler insertion point not found")
          text = text.replace(anchor, replacement, 1)

          anchor = """            isProcessingPhoto = false\n            aiOcrError = null\n            photoNoResult = false\n            isOcrCapturePending = false\n"""
          replacement = """            isProcessingPhoto = false\n            isSavingResult = false\n            aiOcrError = null\n            photoNoResult = false\n            isOcrCapturePending = false\n"""
          if anchor not in text:
              raise SystemExit("resetScannerState insertion point not found")
          text = text.replace(anchor, replacement, 1)

          anchor = """                    onConfirm = { selectedItems, existingContact, conflictResolutions, markerConfig ->\n                        if (onImportToProfile != null) {\n                            onImportToProfile(selectedItems)\n                            resetScannerState()\n                            return@ResultDialog\n                        }\n                        scope.launch(Dispatchers.IO) {\n                            val firstInfo = selectedItems.firstOrNull()?.second ?: return@launch\n"""
          replacement = """                    onConfirm = { selectedItems, existingContact, conflictResolutions, markerConfig ->\n                        if (onImportToProfile != null) {\n                            onImportToProfile(selectedItems)\n                            resetScannerState()\n                            return@ResultDialog\n                        }\n                        if (isSavingResult || selectedItems.isEmpty()) return@ResultDialog\n                        isSavingResult = true\n                        scope.launch(Dispatchers.IO) {\n                            try {\n                                val firstInfo = selectedItems.firstOrNull()?.second\n                                    ?: error(\"扫描结果缺少联系人信息\")\n"""
          if anchor not in text:
              raise SystemExit("onConfirm launch block start not found")
          text = text.replace(anchor, replacement, 1)

          anchor = """                        }\n                        resetScannerState()\n                    },\n                    onAttachToExisting = { contact, info, markerConfig ->\n                        scope.launch(Dispatchers.IO) {\n"""
          replacement = """                            withContext(Dispatchers.Main.immediate) {\n                                resetScannerState()\n                            }\n                        } catch (e: CancellationException) {\n                            throw e\n                        } catch (e: Exception) {\n                            Log.e(TAG, \"保存扫描结果失败\", e)\n                            withContext(Dispatchers.Main.immediate) {\n                                isSavingResult = false\n                                Toast.makeText(\n                                    context,\n                                    \"保存失败：${e.message ?: \"未知错误\"}\",\n                                    Toast.LENGTH_LONG\n                                ).show()\n                            }\n                        }\n                    },\n                    onAttachToExisting = { contact, info, markerConfig ->\n                        if (isSavingResult) return@ResultDialog\n                        isSavingResult = true\n                        scope.launch(Dispatchers.IO) {\n                            try {\n"""
          if anchor not in text:
              raise SystemExit("onConfirm/onAttach boundary not found")
          text = text.replace(anchor, replacement, 1)

          old = """                            withContext(Dispatchers.Main) {\n                                val msg = if (markerConfig.enabled && markerConfig.tagId != null) {\n                                    \"已添加到 ${contact.name}\\n已自动添加标签：${markerConfig.tagName}\"\n                                } else {\n                                    \"已成功附加到 ${contact.name}\"\n                                }\n                                Toast.makeText(context, msg, Toast.LENGTH_SHORT).show()\n                                resetScannerState()\n                            }\n                        }\n"""
          new = """                            withContext(Dispatchers.Main.immediate) {\n                                val msg = if (markerConfig.enabled && markerConfig.tagId != null) {\n                                    \"已添加到 ${contact.name}\\n已自动添加标签：${markerConfig.tagName}\"\n                                } else {\n                                    \"已成功附加到 ${contact.name}\"\n                                }\n                                Toast.makeText(context, msg, Toast.LENGTH_SHORT).show()\n                                resetScannerState()\n                            }\n                            } catch (e: CancellationException) {\n                                throw e\n                            } catch (e: Exception) {\n                                Log.e(TAG, \"附加联系人失败\", e)\n                                withContext(Dispatchers.Main.immediate) {\n                                    isSavingResult = false\n                                    Toast.makeText(\n                                        context,\n                                        \"附加失败：${e.message ?: \"未知错误\"}\",\n                                        Toast.LENGTH_LONG\n                                    ).show()\n                                }\n                            }\n                        }\n"""
          if old not in text:
              raise SystemExit("onAttach completion block not found")
          text = text.replace(old, new, 1)

          saving_dialog = """

            if (isSavingResult) {
                WindowDialog(
                    show = true,
                    title = "正在保存",
                    onDismissRequest = {}
                ) {
                    Column(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalAlignment = Alignment.CenterHorizontally,
                        verticalArrangement = Arrangement.spacedBy(12.dp)
                    ) {
                        CircularProgressIndicator()
                        Text("正在保存联系人信息，请稍候。")
                    }
                }
            }
"""
          tail = "\n            }\n        }\n    }\n}"
          if tail not in text:
              raise SystemExit("ScannerPage tail not found for saving dialog")
          text = text.rsplit(tail, 1)[0] + tail.replace("\n            }\n", "\n            }" + saving_dialog + "\n", 1) + text.rsplit(tail, 1)[1]
          page.write_text(text)

          report = Path("CODE_REVIEW_REPORT_2026-09-01.md")
          r = report.read_text()
          marker = re.search(r"^## 11\.", r, re.M)
          if not marker:
              raise SystemExit("Report section 11 not found")
          section = '''## 10.5 Scanner ResultDialog / saving lifecycle（本轮完成）\n\n- 修复 `ResultDialog` 网络解析协程未绑定 `LaunchedEffect` 生命周期的问题：改为 effect 内直接 `withContext(Dispatchers.IO)`，数据源变化或 Dialog 离场时会正确取消旧解析任务。\n- `batchResolve` 不再吞掉 `CancellationException`，避免协程取消被错误当成网络失败。\n- Scanner 保存/附加联系人改为显式 `isSavingResult` 状态：操作期间保持结果 Dialog，不再提前恢复相机。\n- 保存期间拦截返回键，并增加模态“正在保存”窗口；成功后统一在 Main dispatcher 清理状态，失败时保留页面并给出错误提示，降低重复提交和状态漂移风险。\n- 本轮修改已通过当前分支 GitHub Actions 的 Debug APK 构建任务进入验证链；本地环境无法直接访问 GitHub，故不声称已完成本机 Gradle 构建。\n\n'''
          r = r[:marker.start()] + section + r[marker.start():]
          report.write_text(r)

      - name: Commit final patch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/scanner-ui-fix.yml .github/workflows/ui-lifecycle-fix.yml .github/workflows/_ui_lifecycle_fix.yml || true
          git add app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerDialogs.kt \
                  app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt \
                  CODE_REVIEW_REPORT_2026-09-01.md
          git commit -m "fix(scanner): harden result dialog and save lifecycle"
          git push origin HEAD:refactor/dev-cleanup-2026-08-31
