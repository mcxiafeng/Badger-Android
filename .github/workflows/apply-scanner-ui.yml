name: Apply Scanner UI Fix

on:
  push:
    branches:
      - refactor/dev-cleanup-2026-08-31

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: yes | sdkmanager --licenses
      - run: sdkmanager --install "build-tools;34.0.0"
      - run: sdkmanager --install "platforms;android-37" --channel=3 || true
      - uses: gradle/actions/setup-gradle@v4
      - run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_scanner.py
          python3 /tmp/patch_scanner.py

      - name: Build Debug APK before commit
        run: ./gradlew assembleDebug --stacktrace

      - name: Persist changes and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/ci.yml
          git rm -f .github/workflows/apply-scanner-ui.yml .github/workflows/test-trigger.yml .github/workflows/_ui_lifecycle_fix.yml .github/workflows/ui-lifecycle-fix.yml .github/workflows/scanner-ui-fix.yml .github/workflows/finalize-scanner-ui.yml || true
          git add app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt CODE_REVIEW_REPORT_2026-09-01.md .github/workflows/ci.yml
          git commit -m "fix(scanner): harden result dialog and save lifecycle"
          git push origin HEAD:refactor/dev-cleanup-2026-08-31
