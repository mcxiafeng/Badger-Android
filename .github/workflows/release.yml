name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    environment: Action Key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK Components
        run: |
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "platforms;android-37" --channel=3 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local Java home override
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Beta APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleBeta --stacktrace

      - name: Upload Release arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          retention-days: 30

      - name: Upload Release armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-armeabi-v7a
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          retention-days: 30

      - name: Upload Release x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-x86_64
          path: app/build/outputs/apk/release/*x86_64*.apk
          retention-days: 30

      - name: Upload Beta arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: beta-apk-arm64-v8a
          path: app/build/outputs/apk/beta/*arm64-v8a*.apk
          retention-days: 30

      - name: Upload Beta armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: beta-apk-armeabi-v7a
          path: app/build/outputs/apk/beta/*armeabi-v7a*.apk
          retention-days: 30

      - name: Upload Beta x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: beta-apk-x86_64
          path: app/build/outputs/apk/beta/*x86_64*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*arm64-v8a*.apk
            app/build/outputs/apk/release/*armeabi-v7a*.apk
            app/build/outputs/apk/release/*x86_64*.apk
            app/build/outputs/apk/beta/*arm64-v8a*.apk
            app/build/outputs/apk/beta/*armeabi-v7a*.apk
            app/build/outputs/apk/beta/*x86_64*.apk