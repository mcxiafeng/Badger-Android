name: Finalize UI Refactor

on:
  push:
    branches: [refactor/dev-cleanup-2026-08-31]

concurrency:
  group: finalize-ui-refactor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'chore(ui): finalize UI refactor' && github.event.head_commit.message != 'chore(ci): remove finalize UI refactor workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dev-cleanup-2026-08-31
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK Components
        run: |
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "platforms;android-37" --channel=3 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply UI/architecture refactors
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          kt_root = root / 'app/src/main/kotlin'

          # T8 Person: remove stale callbacks and composition-time mutable state.
          p = kt_root / 'top/mcxiafeng/badger/pages/person/PersonPage.kt'
          s = p.read_text()
          s = s.replace('        onRefreshData = { viewModel.refreshUserProfile() },\n', '')
          s = s.replace('        onAddContact = onScanContact,\n', '')
          s = s.replace('    onRefreshData: () -> Unit = {},\n', '')
          s = s.replace('    onAddContact: () -> Unit = {},\n', '')
          s = re.sub(r'    // PersonScreen 每次重进 composition.*?\n    LaunchedEffect\(Unit\) \{\n        onRefreshData\(\)\n    \}\n\n', '', s, flags=re.S)
          s = re.sub(r'    // 跟踪已显示的字母标题.*?val lastShownLetter = remember \{ Ref<String\?>\(null\) \}\n\n', '', s, flags=re.S)
          s = s.replace('        if (showAlphabetHeaders) lastShownLetter.v = null\n', '')
          s = s.replace('''                            val showHeader = if (!showAlphabetHeaders) {\n                                false\n                            } else if (prevLetter != null) {\n                                currentLetter != prevLetter\n                            } else {\n                                currentLetter != lastShownLetter.v\n                            }''', '''                            val showHeader = showAlphabetHeaders &&\n                                (index == 0 || currentLetter != prevLetter)''')
          s = s.replace('                                    lastShownLetter.v = currentLetter\n', '')
          helper_start = s.find('/**\n * 「我的名片」头部组件')
          ref_start = s.find('/** 简单可变引用包装', helper_start)
          if helper_start >= 0 and ref_start >= 0:
              ref_end = s.find('\n', s.find('private class Ref<T>(var v: T)', ref_start))
              end = ref_end if ref_end >= 0 else len(s)
              helpers = s[helper_start:end].strip() + '\n'
              for name in ('MyProfileHeader', 'ContactItem', 'ContactRow'):
                  helpers = helpers.replace(f'private fun {name}', f'internal fun {name}')
              helpers = helpers.replace('fun LetterIndexBar(', 'internal fun LetterIndexBar(', 1)
              helpers = helpers.replace('fun LetterTooltip(', 'internal fun LetterTooltip(', 1)
              imports = s[:s.find('private const val TAG')]
              (p.parent / 'PersonListComponents.kt').write_text(imports + '\n' + helpers)
              s = s[:helper_start].rstrip() + '\n'
          p.write_text(s)

          # T9 ContactDetail: all avatar persistence happens in the ViewModel/AvatarStorage.
          p = kt_root / 'top/mcxiafeng/badger/pages/person/contact/ContactDetailPage.kt'
          s = p.read_text()
          old = '''    val onCropConfirm: (Bitmap) -> Unit = { croppedBitmap ->\n        scope.launch {\n            try {\n                val avatarFile = withContext(Dispatchers.IO) {\n                    Methods.saveBitmapAsAvatar(context, croppedBitmap, "contact_${contactId}_avatar.webp")\n                }\n                viewModel.applyAvatarUpdate(contactId, avatarFile.absolutePath)\n                avatarVersion++\n            } catch (e: Exception) {\n                Log.e("ContactDetailPage", "设置头像失败", e)\n                Toast.makeText(context, "设置头像失败", Toast.LENGTH_SHORT).show()\n            }\n        }\n    }'''
          if old in s:
              s = s.replace(old, '''    val onCropConfirm: (Bitmap) -> Unit = { croppedBitmap ->\n        viewModel.saveAndApplyAvatar(contactId, croppedBitmap)\n        avatarVersion++\n    }''', 1)
          p.write_text(s)

          # T10 Card: remove dead compatibility callbacks.
          p = kt_root / 'top/mcxiafeng/badger/pages/card/CardPage.kt'
          s = p.read_text().replace('''fun CardRoute(\n    onScanToCollection: ((Long) -> Unit)? = null,\n    onContactClick: ((Long) -> Unit)? = null,\n    onNavigateToCollectionDetail: (Long) -> Unit = {}\n) {''', '''fun CardRoute(\n    onNavigateToCollectionDetail: (Long) -> Unit = {}\n) {''')
          p.write_text(s)

          # T13: constructor inject Dashboard and ContactDetail resolver dependencies.
          p = kt_root / 'top/mcxiafeng/badger/pages/dashboard/DashboardViewModel.kt'
          s = p.read_text()
          s = re.sub(r'class DashboardViewModel\(\n\s*private val dispatcher: CoroutineDispatcher = Dispatchers.IO,\n\)', '''class DashboardViewModel(\n    private val serverApi: ServerApi,\n    private val userAuthRepository: UserAuthRepository,\n    private val contactCacheDao: ContactCacheDao,\n    private val tagCacheDao: TagCacheDao,\n    private val collectionCacheDao: CardCollectionCacheDao,\n    private val dispatcher: CoroutineDispatcher = Dispatchers.IO,\n)''', s)
          s = re.sub(r'\n\s*private val serverApi: ServerApi = .*?\n\s*private val userAuthRepository: UserAuthRepository = .*?\n\s*private val contactCacheDao: ContactCacheDao = .*?\n\s*private val tagCacheDao: TagCacheDao = .*?\n\s*private val collectionCacheDao: CardCollectionCacheDao = .*?\n', '\n', s, count=1)
          p.write_text(s)

          p = kt_root / 'top/mcxiafeng/badger/pages/person/contact/ContactDetailViewModel.kt'
          s = p.read_text()
          s = s.replace('    private val avatarStorage: AvatarStorage,\n) : ViewModel() {', '    private val avatarStorage: AvatarStorage,\n    private val networkResolver: ContactNetworkResolver,\n) : ViewModel() {', 1)
          s = s.replace('ContactNetworkResolver.getResultInfo(link, emptyMap(), def?.contactType)', 'networkResolver.identify(link)', 1)
          s = s.replace('ContactNetworkResolver.identifyBatch(urls)', 'networkResolver.identifyBatch(urls)', 1)
          p.write_text(s)

          # T13: migrate every remaining Kotlin service-locator call in Compose sources.
          for p in kt_root.rglob('*.kt'):
              if p.name in {'KoinComponentBy.kt', 'ContactDetailViewModel.kt', 'DashboardViewModel.kt'}:
                  continue
              s = p.read_text()
              if 'KoinComponentBy.get<' not in s:
                  continue
              s = re.sub(r'remember\s*\{\s*KoinComponentBy\.get<([^>]+)>\(\)\s*\}', r'koinInject<\1>()', s)
              s = re.sub(r'KoinComponentBy\.get<([^>]+)>\(\)', r'koinInject<\1>()', s)
              s = s.replace('import top.mcxiafeng.badger.di.KoinComponentBy\n', '')
              if 'koinInject<' in s and 'import org.koin.compose.koinInject' not in s:
                  first = s.find('import ')
                  s = s[:first] + 'import org.koin.compose.koinInject\n' + s[first:]
              p.write_text(s)

          # AuthScreen already has a ViewModel; expose URL verification there.
          p = kt_root / 'top/mcxiafeng/badger/pages/auth/AuthViewModel.kt'
          s = p.read_text()
          if 'val isUrlVerified: StateFlow<Boolean>' not in s:
              s = s.replace('    private val serverUrlHolder: ServerUrlHolder,\n) : ViewModel() {', '    private val serverUrlHolder: ServerUrlHolder,\n) : ViewModel() {\n\n    val isUrlVerified: StateFlow<Boolean> = serverUrlHolder.isUrlVerified', 1)
              p.write_text(s)

          p = kt_root / 'top/mcxiafeng/badger/pages/auth/AuthScreens.kt'
          s = p.read_text()
          s = s.replace('import top.mcxiafeng.badger.pages.settings.AccountSettingsViewModel\n', '')
          s = s.replace('import top.mcxiafeng.badger.data.repository.ServerUrlHolder\n', '')
          s = re.sub(r'    val accountViewModel: AccountSettingsViewModel = koinViewModel\(\)\n    val accountState by accountViewModel\.state\.collectAsState\(\)\n    val serverUrlHolder: ServerUrlHolder = top\.mcxiafeng\.badger\.di\.KoinComponentBy\.get\(\)\n    val isUrlVerified by serverUrlHolder\.isUrlVerified\.collectAsState\(\)', '    val isUrlVerified by viewModel.isUrlVerified.collectAsState()', s, count=1)
          p.write_text(s)

          # Final legacy sweep: migrate EmptyStateView callers and delete only after no references remain.
          for p in kt_root.rglob('*.kt'):
              s = p.read_text()
              if 'EmptyStateView' not in s:
                  continue
              s = s.replace('EmptyStateView(', 'BadgerEmptyState(')
              s = s.replace('import top.mcxiafeng.badger.ui.components.EmptyStateView\n', 'import top.mcxiafeng.badger.ui.components.BadgerEmptyState\n')
              p.write_text(s)
          old_empty = kt_root / 'top/mcxiafeng/badger/ui/components/EmptyStateView.kt'
          if old_empty.exists() and not any('EmptyStateView' in p.read_text() for p in kt_root.rglob('*.kt')):
              old_empty.unlink()

          # Only delete KoinComponentBy after all consumers are actually gone.
          shim = kt_root / 'top/mcxiafeng/badger/di/KoinComponentBy.kt'
          if shim.exists() and not any('KoinComponentBy' in p.read_text() for p in kt_root.rglob('*.kt') if p != shim):
              shim.unlink()

      - name: Verify source invariants
        run: |
          ! rg -n 'KoinComponentBy|EmptyStateView' app/src/main/kotlin
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Commit final refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin
          git diff --cached --check
          git commit -m 'chore(ui): finalize UI refactor' || exit 1
          git push origin HEAD:refactor/dev-cleanup-2026-08-31

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/finalize-ui-refactor.yml
          git commit -m 'chore(ci): remove finalize UI refactor workflow'
          git push origin HEAD:refactor/dev-cleanup-2026-08-31
