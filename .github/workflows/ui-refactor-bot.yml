name: UI Refactor Bot

on:
  push:
    branches: [refactor/dev-cleanup-2026-08-31]

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message != 'chore(ui): apply automated refactor batch' && github.event.head_commit.message != 'chore(ci): remove one-shot UI refactor bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dev-cleanup-2026-08-31
          fetch-depth: 1

      - name: Apply safe UI refactors and restore compile invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          def patch(path, old, new, label):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {label} in {path}')
              p.write_text(s.replace(old, new, 1))

          # T8: Person. Remove dead callbacks and mutable composition state.
          p = root / 'app/src/main/kotlin/top/mcxiafeng/badger/pages/person/PersonPage.kt'
          s = p.read_text()
          s = s.replace('        onRefreshData = { viewModel.refreshUserProfile() },\n', '')
          s = s.replace('        onAddContact = onScanContact,\n', '')
          s = s.replace('    onRefreshData: () -> Unit = {},\n', '')
          s = s.replace('    onAddContact: () -> Unit = {},\n', '')
          s = re.sub(r'    // PersonScreen 每次重进 composition.*?\n    LaunchedEffect\(Unit\) \{\n        onRefreshData\(\)\n    \}\n\n', '', s, flags=re.S)
          s = re.sub(r'    // 跟踪已显示的字母标题.*?val lastShownLetter = remember \{ Ref<String\?>\(null\) \}\n\n', '', s, flags=re.S)
          s = s.replace('        if (showAlphabetHeaders) lastShownLetter.v = null\n', '')
          s = s.replace('''                            val showHeader = if (!showAlphabetHeaders) {\n                                false\n                            } else if (prevLetter != null) {\n                                currentLetter != prevLetter\n                            } else {\n                                currentLetter != lastShownLetter.v\n                            }''', '''                            val showHeader = showAlphabetHeaders &&\n                                (index == 0 || currentLetter != prevLetter)''')
          s = s.replace('                                    lastShownLetter.v = currentLetter\n', '')
          s = re.sub(r'\n/\*\* 简单可变引用包装.*?\nprivate class Ref<T>\(var v: T\)\n', '\n', s, flags=re.S)
          p.write_text(s)

          # T9: route bitmap persistence through AvatarStorage owned by the VM.
          p = root / 'app/src/main/kotlin/top/mcxiafeng/badger/pages/person/contact/ContactDetailPage.kt'
          s = p.read_text()
          old = '''    val onCropConfirm: (Bitmap) -> Unit = { croppedBitmap ->\n        scope.launch {\n            try {\n                val avatarFile = withContext(Dispatchers.IO) {\n                    Methods.saveBitmapAsAvatar(context, croppedBitmap, "contact_${contactId}_avatar.webp")\n                }\n                viewModel.applyAvatarUpdate(contactId, avatarFile.absolutePath)\n                avatarVersion++\n            } catch (e: Exception) {\n                Log.e("ContactDetailPage", "设置头像失败", e)\n                Toast.makeText(context, "设置头像失败", Toast.LENGTH_SHORT).show()\n            }\n        }\n    }'''
          new = '''    val onCropConfirm: (Bitmap) -> Unit = { croppedBitmap ->\n        viewModel.saveAndApplyAvatar(contactId, croppedBitmap)\n        avatarVersion++\n    }'''
          if old not in s:
              raise SystemExit('missing avatar write anchor')
          p.write_text(s.replace(old, new, 1))

          # T10: remove dead compatibility callbacks from CardRoute.
          p = root / 'app/src/main/kotlin/top/mcxiafeng/badger/pages/card/CardPage.kt'
          s = p.read_text()
          old = '''fun CardRoute(\n    onScanToCollection: ((Long) -> Unit)? = null,\n    onContactClick: ((Long) -> Unit)? = null,\n    onNavigateToCollectionDetail: (Long) -> Unit = {}\n) {'''
          new = '''fun CardRoute(\n    onNavigateToCollectionDetail: (Long) -> Unit = {}\n) {'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Fix the Koin 4 Java bridge signature used by the resolver compatibility methods.
          p = root / 'app/src/main/kotlin/top/mcxiafeng/badger/network/ContactNetworkResolver.kt'
          s = p.read_text()
          s = s.replace('KoinJavaComponent.get<ContactNetworkResolver>()', 'KoinJavaComponent.get(ContactNetworkResolver::class.java)')
          p.write_text(s)

          # Restore a tiny compatibility shim temporarily so the whole branch can compile while
          # the remaining consumers are migrated in T13. This shim is not a UI API and is verified
          # for zero consumers before T13 is marked complete.
          shim = root / 'app/src/main/kotlin/top/mcxiafeng/badger/di/KoinComponentBy.kt'
          shim.write_text('''package top.mcxiafeng.badger.di\n\nimport org.koin.java.KoinJavaComponent\n\n/** Temporary migration bridge. Remove after all consumers are constructor-injected or koinInject(). */\n@Deprecated("Migrate callers away from the service locator", level = DeprecationLevel.WARNING)\nobject KoinComponentBy {\n    inline fun <reified T : Any> get(): T = KoinJavaComponent.get(T::class.java)\n}\n''')

          # Migrate the removed EmptyStateView compatibility name at all remaining call sites.
          for p in (root / 'app/src/main/kotlin').rglob('*.kt'):
              s = p.read_text()
              if 'EmptyStateView' not in s:
                  continue
              s = s.replace('EmptyStateView(', 'BadgerEmptyState(')
              s = s.replace('import top.mcxiafeng.badger.ui.components.EmptyStateView', 'import top.mcxiafeng.badger.ui.components.BadgerEmptyState')
              p.write_text(s)

          # AuthScreen should observe the URL verification flow exposed by its VM.
          p = root / 'app/src/main/kotlin/top/mcxiafeng/badger/pages/auth/AuthScreens.kt'
          s = p.read_text()
          s = s.replace('import top.mcxiafeng.badger.pages.settings.AccountSettingsViewModel\n', '')
          s = s.replace('import top.mcxiafeng.badger.data.repository.ServerUrlHolder\n', '')
          s = s.replace('''    val accountViewModel: AccountSettingsViewModel = koinViewModel()\n    val accountState by accountViewModel.state.collectAsState()\n    val serverUrlHolder: ServerUrlHolder = top.mcxiafeng.badger.di.KoinComponentBy.get()\n    val isUrlVerified by serverUrlHolder.isUrlVerified.collectAsState()''', '''    val isUrlVerified by viewModel.isUrlVerified.collectAsState()''')
          p.write_text(s)

          p = root / 'app/src/main/kotlin/top/mcxiafeng/badger/pages/auth/AuthViewModel.kt'
          s = p.read_text()
          if 'val isUrlVerified: StateFlow<Boolean>' not in s:
              s = s.replace('    private val serverUrlHolder: ServerUrlHolder,\n) : ViewModel() {', '    private val serverUrlHolder: ServerUrlHolder,\n) : ViewModel() {\n\n    val isUrlVerified: StateFlow<Boolean> = serverUrlHolder.isUrlVerified')
              p.write_text(s)

      - name: Compile debug APK and report errors
        run: ./gradlew assembleDebug --stacktrace

      - name: Commit refactors
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin
          git diff --cached --check
          git commit -m 'chore(ui): apply automated refactor batch' || exit 0
          git push origin HEAD:refactor/dev-cleanup-2026-08-31

      - name: Remove refactor bot workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/ui-refactor-bot.yml
          git commit -m 'chore(ci): remove one-shot UI refactor bot'
          git push origin HEAD:refactor/dev-cleanup-2026-08-31
