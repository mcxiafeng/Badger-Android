name: temporary-ui-lifecycle-fix

on:
  push:
    branches:
      - refactor/dev-cleanup-2026-08-31

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dev-cleanup-2026-08-31
          fetch-depth: 2

      - name: Patch scanner resolver lifecycle
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerDialogs.kt")
          text = path.read_text()

          if "import kotlinx.coroutines.CancellationException" not in text:
              text = text.replace(
                  "import kotlinx.coroutines.Dispatchers\n",
                  "import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.CancellationException\n",
                  1,
              )

          old = '''    } catch (e: Throwable) {\n        Log.w("ScannerDialogs", "batchResolve failed: ${e.message}")\n        List(jobs.size) { null }\n    }'''
          new = '''    } catch (e: Throwable) {\n        if (e is CancellationException) throw e\n        Log.w("ScannerDialogs", "batchResolve failed: ${e.message}")\n        List(jobs.size) { null }\n    }'''
          if old not in text:
              raise SystemExit("batchResolve catch block not found")
          text = text.replace(old, new, 1)

          old = """    val scope = rememberCoroutineScope()\n\n    // 每个二维码的独立解析状态"""
          if old not in text:
              raise SystemExit("ResultDialog scope declaration not found")
          text = text.replace(old, "    // 每个二维码的独立解析状态", 1)

          count = text.count("scope.launch(Dispatchers.IO) {")
          if count != 2:
              raise SystemExit(f"expected 2 resolver launches, found {count}")
          text = text.replace("scope.launch(Dispatchers.IO) {", "withContext(Dispatchers.IO) {", 2)
          path.write_text(text)

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerDialogs.kt
          git rm .github/workflows/ui-lifecycle-fix.yml
          git commit -m "fix(scanner): bind resolver jobs to UI lifecycle"
          git push origin HEAD:refactor/dev-cleanup-2026-08-31
