name: temporary-ui-lifecycle-fix

on:
  push:
    branches:
      - refactor/dev-cleanup-2026-08-31

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dev-cleanup-2026-08-31
          fetch-depth: 2

      - name: Patch ScannerPage and report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path("app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt")
          page = page_path.read_text()

          def matching_brace(text, opening):
              depth = 0
              i = opening
              string = char = line = block = triple = False
              escape = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""
                  if line:
                      if c == "\n": line = False
                  elif block:
                      if c == "*" and n == "/": block = False; i += 1
                  elif triple:
                      if text.startswith('"""', i): triple = False; i += 2
                  elif string:
                      if escape: escape = False
                      elif c == "\\": escape = True
                      elif c == '"': string = False
                  elif char:
                      if escape: escape = False
                      elif c == "\\": escape = True
                      elif c == "'": char = False
                  else:
                      if c == "/" and n == "/": line = True; i += 1
                      elif c == "/" and n == "*": block = True; i += 1
                      elif text.startswith('"""', i): triple = True; i += 2
                      elif c == '"': string = True
                      elif c == "'": char = True
                      elif c == "{": depth += 1
                      elif c == "}":
                          depth -= 1
                          if depth == 0: return i
                  i += 1
              raise RuntimeError("unmatched brace")

          # Imports.
          if "import kotlinx.coroutines.CancellationException" not in page:
              page = page.replace("import kotlinx.coroutines.Dispatchers\n", "import kotlinx.coroutines.CancellationException\nimport kotlinx.coroutines.Dispatchers\n", 1)
          if "import top.yukonga.miuix.kmp.basic.CircularProgressIndicator" not in page:
              page = page.replace("import top.yukonga.miuix.kmp.basic.Text\n", "import top.yukonga.miuix.kmp.basic.CircularProgressIndicator\nimport top.yukonga.miuix.kmp.basic.Text\n", 1)
          if "import top.yukonga.miuix.kmp.window.WindowDialog" not in page:
              page = page.replace("import top.yukonga.miuix.kmp.basic.Text\n", "import top.yukonga.miuix.kmp.basic.Text\nimport top.yukonga.miuix.kmp.window.WindowDialog\n", 1)

          if "var isSavingResult by remember { mutableStateOf(false) }" not in page:
              page = page.replace("    var isProcessingPhoto by remember { mutableStateOf(false) }\n", "    var isProcessingPhoto by remember { mutableStateOf(false) }\n    var isSavingResult by remember { mutableStateOf(false) }\n", 1)

          page = page.replace(
              "    val hasResultDialog = scanResult != null || ocrExtractedInfo != null || qrCodeContents.isNotEmpty() || isProcessingPhoto || aiOcrError != null || photoNoResult\n",
              "    val hasResultDialog = scanResult != null || ocrExtractedInfo != null || qrCodeContents.isNotEmpty() || isProcessingPhoto || aiOcrError != null || photoNoResult || isSavingResult\n",
              1,
          )
          page = page.replace("    BackHandler(enabled = hasResultDialog) {\n", "    BackHandler(enabled = hasResultDialog && !isSavingResult) {\n", 1)
          if "BackHandler(enabled = isSavingResult)" not in page:
              page = page.replace("    BackHandler(enabled = !hasResultDialog) {\n", "    BackHandler(enabled = isSavingResult) { }\n    BackHandler(enabled = !hasResultDialog) {\n", 1)
          page = page.replace("            isProcessingPhoto = false\n            aiOcrError = null\n", "            isProcessingPhoto = false\n            isSavingResult = false\n            aiOcrError = null\n", 1)

          # Add save guard before the first persistence coroutine.
          confirm = "                    onConfirm = { selectedItems, existingContact, conflictResolutions, markerConfig ->"
          cp = page.index(confirm)
          if "if (isSavingResult || selectedItems.isEmpty()) return@ResultDialog" not in page[cp:cp+800]:
              launch = page.index("scope.launch(Dispatchers.IO) {", cp)
              page = page[:launch] + "if (isSavingResult || selectedItems.isEmpty()) return@ResultDialog\n                        isSavingResult = true\n                        " + page[launch:]
              cp = page.index(confirm)

          # Wrap onConfirm persistence in try/catch and move reset inside success path.
          lp = page.index("scope.launch(Dispatchers.IO) {", cp)
          op = page.index("{", lp)
          cl = matching_brace(page, op)
          body = page[op+1:cl]
          body = body.rstrip()
          body = body.removesuffix("\n")
          new_body = (
              "\n                            try {" + body +
              "\n                            withContext(Dispatchers.Main.immediate) {\n                                resetScannerState()\n                            }\n" +
              "                        } catch (e: CancellationException) {\n"
              "                            throw e\n"
              "                        } catch (e: Exception) {\n"
              "                            Log.e(TAG, \"保存扫描结果失败\", e)\n"
              "                            withContext(Dispatchers.Main.immediate) {\n"
              "                                isSavingResult = false\n"
              "                                Toast.makeText(context, \"保存失败：${e.message ?: \"未知错误\"}\", Toast.LENGTH_LONG).show()\n"
              "                            }"
          )
          page = page[:op+1] + new_body + "\n                        }\n                    }," + page[cl+1:]
          page = page.replace("                    },\n                    onAttachToExisting =", "                    },\n                    onAttachToExisting =", 1)

          # Guard and wrap onAttachToExisting.
          attach = "                    onAttachToExisting = { contact, info, markerConfig ->"
          ap = page.index(attach)
          if "if (isSavingResult) return@ResultDialog" not in page[ap:ap+500]:
              eol = page.index("\n", ap) + 1
              page = page[:eol] + "                        if (isSavingResult) return@ResultDialog\n                        isSavingResult = true\n" + page[eol:]
              ap = page.index(attach)
          lp = page.index("scope.launch(Dispatchers.IO) {", ap)
          op = page.index("{", lp)
          cl = matching_brace(page, op)
          body = page[op+1:cl].replace("withContext(Dispatchers.Main) {", "withContext(Dispatchers.Main.immediate) {", 1).rstrip()
          new_body = (
              "\n                            try {" + body +
              "\n                        } catch (e: CancellationException) {\n"
              "                            throw e\n"
              "                        } catch (e: Exception) {\n"
              "                            Log.e(TAG, \"附加联系人失败\", e)\n"
              "                            withContext(Dispatchers.Main.immediate) {\n"
              "                                isSavingResult = false\n"
              "                                Toast.makeText(context, \"附加失败：${e.message ?: \"未知错误\"}\", Toast.LENGTH_LONG).show()\n"
              "                            }"
          )
          page = page[:op+1] + new_body + "\n                        }\n                    }" + page[cl+1:]

          # Add visible modal progress UI after ResultDialog invocation.
          if "title = \"正在保存\"" not in page:
              tail = "\n            }\n        }\n    }\n}\n"
              if tail not in page:
                  raise RuntimeError("ScannerPage tail not found")
              dialog = """

            if (isSavingResult) {
                WindowDialog(
                    show = true,
                    title = "正在保存",
                    onDismissRequest = {}
                ) {
                    Column(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalAlignment = Alignment.CenterHorizontally,
                        verticalArrangement = Arrangement.spacedBy(12.dp)
                    ) {
                        CircularProgressIndicator()
                        Text("正在保存联系人信息，请稍候。")
                    }
                }
            }"""
              page = page.rsplit(tail, 1)[0] + dialog + tail

          page_path.write_text(page)

          report_path = Path("CODE_REVIEW_REPORT_2026-09-01.md")
          report = report_path.read_text()
          if "### 10.5 Scanner ResultDialog / saving lifecycle（本轮完成）" not in report:
              idx = report.find("## 11.")
              if idx < 0: raise RuntimeError("report section 11 not found")
              section = """### 10.5 Scanner ResultDialog / saving lifecycle（本轮完成）

- `ResultDialog` 网络解析已经绑定 `LaunchedEffect` 的结构化生命周期；输入变化或 Dialog 离场时旧解析任务会取消。
- `batchResolve` 保留 `CancellationException`，不会将协程取消误判为普通网络失败。
- `ScannerPage` 新增 `isSavingResult`：保存/附加期间保持结果 UI、暂停相机、拦截返回，并阻止重复提交。
- 保存期间显示模态进度窗口；成功后统一在 Main dispatcher 清理状态，失败时保留结果并提示错误。
- 当前执行环境无法直接进行本机 Gradle 构建，因此最终构建结果以该分支 GitHub Actions 为准。

"""
              report_path.write_text(report[:idx] + section + report[idx:])
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          grep -q 'var isSavingResult by remember' app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt
          grep -q 'title = "正在保存"' app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt
          grep -q '### 10.5 Scanner ResultDialog / saving lifecycle（本轮完成）' CODE_REVIEW_REPORT_2026-09-01.md
          git add app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt CODE_REVIEW_REPORT_2026-09-01.md
          git rm -f .github/workflows/_ui_lifecycle_fix.yml .github/workflows/scanner-ui-fix.yml .github/workflows/finalize-scanner-ui.yml || true
          git rm -f .github/workflows/ui-lifecycle-fix.yml
          git commit -m "fix(scanner): harden result dialog and save lifecycle"
          git push origin HEAD:refactor/dev-cleanup-2026-08-31
