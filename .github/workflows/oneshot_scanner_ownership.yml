name: One-shot scanner ownership patch

on:
  push:
    branches:
      - refactor/dev-cleanup-2026-08-31

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'mcxiafeng'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dev-cleanup-2026-08-31
          fetch-depth: 1

      - name: Apply Scanner Bitmap ownership patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt')
          text = path.read_text(encoding='utf-8')

          if 'private fun launchPhotoBitmapProcessing(' in text:
              raise SystemExit('patch already present')

          text = text.replace(
              'import android.graphics.BitmapFactory',
              'import android.graphics.Bitmap\nimport android.graphics.BitmapFactory',
              1,
          )

          def matching_brace(source, open_idx):
              depth = 0
              i = open_idx
              state = 'code'
              quote = None
              escaped = False
              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''
                  if state == 'code':
                      if c == '/' and n == '/':
                          state = 'line_comment'; i += 2; continue
                      if c == '/' and n == '*':
                          state = 'block_comment'; i += 2; continue
                      if c in ('"', "'"):
                          state = 'string'; quote = c; escaped = False; i += 1; continue
                      if c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return i
                      i += 1
                  elif state == 'line_comment':
                      if c == '\n': state = 'code'
                      i += 1
                  elif state == 'block_comment':
                      if c == '*' and n == '/': state = 'code'; i += 2
                      else: i += 1
                  else:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: state = 'code'
                      i += 1
              raise RuntimeError('unmatched brace')

          def replace_launch(source, process_call, helper_call):
              marker = 'scope.launch(Dispatchers.IO) {'
              search = 0
              count = 0
              while True:
                  start = source.find(marker, search)
                  if start < 0: break
                  body_open = source.find('{', start)
                  outer_end = matching_brace(source, body_open)
                  body = source[body_open + 1:outer_end]
                  call_start = body.find(process_call)
                  if call_start >= 0:
                      inner_open = body.find('{', call_start)
                      inner_end = matching_brace(body, inner_open)
                      callback = body[inner_open + 1:inner_end]
                      indent_start = source.rfind('\n', 0, start) + 1
                      indent = source[indent_start:start]
                      replacement = helper_call + ' {' + callback + '\n' + indent + '}'
                      source = source[:start] + replacement + source[outer_end + 1:]
                      search = start + len(replacement)
                      count += 1
                  else:
                      search = outer_end + 1
              return source, count

          text, photo_count = replace_launch(
              text,
              'processPhotoBitmap(context, bitmap, aiOcrEnabled)',
              'launchPhotoBitmapProcessing(scope, context, bitmap, aiOcrEnabled)',
          )
          text, ocr_count = replace_launch(
              text,
              'processBitmapOcrOnly(context, bitmap)',
              'launchOcrBitmapProcessing(scope, context, bitmap)',
          )

          if photo_count != 2 or ocr_count != 1:
              raise SystemExit(f'unexpected processing launch count: photo={photo_count}, ocr={ocr_count}')

          helpers = r'''

private fun launchPhotoBitmapProcessing(
    scope: kotlinx.coroutines.CoroutineScope,
    context: android.content.Context,
    bitmap: Bitmap,
    aiOcrEnabled: Boolean,
    onComplete: (List<String>, ExtractedContactInfo?, String?) -> Unit,
) {
    val processingBitmap = bitmap.copy(Bitmap.Config.ARGB_8888, false)
        ?: error("Failed to create Bitmap processing copy")
    scope.launch(Dispatchers.IO) {
        try {
            processPhotoBitmap(context, processingBitmap, aiOcrEnabled, onComplete)
        } finally {
            if (!processingBitmap.isRecycled) processingBitmap.recycle()
        }
    }
}

private fun launchOcrBitmapProcessing(
    scope: kotlinx.coroutines.CoroutineScope,
    context: android.content.Context,
    bitmap: Bitmap,
    onComplete: (ExtractedContactInfo?, String?) -> Unit,
) {
    val processingBitmap = bitmap.copy(Bitmap.Config.ARGB_8888, false)
        ?: error("Failed to create OCR Bitmap processing copy")
    scope.launch(Dispatchers.IO) {
        try {
            processBitmapOcrOnly(context, processingBitmap, onComplete)
        } finally {
            if (!processingBitmap.isRecycled) processingBitmap.recycle()
        }
    }
}
'''
          text = text.rstrip() + helpers + '\n'
          path.write_text(text, encoding='utf-8')

      - name: Commit Scanner ownership fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/top/mcxiafeng/badger/pages/scanner/ScannerPage.kt
          git rm .github/workflows/oneshot_scanner_ownership.yml
          git commit -m 'fix(scanner): isolate bitmap ownership from UI state'
          git push origin HEAD:refactor/dev-cleanup-2026-08-31
